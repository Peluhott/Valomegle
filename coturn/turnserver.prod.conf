# Production coturn settings (docker-compose.prod.yml). TURN_SECRET and the
# public/private IP mapping are passed as CLI flags from the compose file, since
# coturn's config file doesn't expand env vars.
listening-port=3478
fingerprint
use-auth-secret
realm=valomegle
min-port=49160
max-port=49200
no-cli
no-tls
no-dtls
log-file=stdout

# Only relay to public addresses. Without these, anyone holding valid TURN
# credentials could use the relay to reach the instance's private network - the
# Docker bridge (Redis, backend), the VPC, or the EC2 metadata service.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
