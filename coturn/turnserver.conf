# Static coturn settings for local dev. TURN_SECRET is passed as a
# --static-auth-secret CLI override from docker-compose.yml instead of being
# interpolated here, since coturn's config file doesn't expand env vars. The
# backend (turn/TurnCredentialService.java) mints short-lived credentials against
# that same secret - no static username/password is configured here anymore.
listening-port=3478
fingerprint
use-auth-secret
realm=valomegle.local
min-port=49160
max-port=49200
no-cli
log-file=stdout

# On Docker Desktop for macOS/Windows there's no host networking, so coturn's
# relay candidates advertise the container's internal IP by default and won't
# be reachable from outside. If testing the TURN path across two real machines,
# uncomment and set this to the host's LAN-reachable IP:
# external-ip=<host-ip>
