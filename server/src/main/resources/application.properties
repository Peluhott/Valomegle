spring.application.name=valomegle

# Load local secrets from .env (optional so prod/CI can supply real env vars instead)
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway owns the schema (db/migration); baseline-on-migrate lets it adopt an
# existing Hibernate-created dev DB without re-running V1 against it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Secrets are pulled from environment / .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:true}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# TURN credential minting (turn/TurnCredentialService.java) — TURN_SECRET must match
# coturn's static-auth-secret.
turn.url=${TURN_URL:}
turn.secret=${TURN_SECRET:}

# Only expose health, not the full actuator surface, since this sits behind a public ALB.
management.endpoints.web.exposure.include=health

# --- Logging ---
# Write logs to a file instead of the terminal
logging.file.name=logs/valomegle.log
# Disable console output (empty pattern suppresses it)
logging.threshold.console=OFF

# Rolling policy limits
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
# Keep rotated archives as plain .log files (default pattern ends in .gz, which triggers compression)
logging.logback.rollingpolicy.file-name-pattern=logs/valomegle.log.%d{yyyy-MM-dd}.%i

# Log levels
logging.level.root=INFO
logging.level.com.sedanodev=${APP_LOG_LEVEL:INFO}
