spring.application.name=valomegle

# Load local secrets from .env (optional so prod/CI can supply real env vars instead)
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Secrets are pulled from environment / .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# --- Logging ---
# Write logs to a file instead of the terminal
logging.file.name=logs/valomegle.log
# Disable console output (empty pattern suppresses it)
logging.threshold.console=OFF

# Rolling policy limits
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# Log levels
logging.level.root=INFO
logging.level.com.sedanodev=DEBUG
